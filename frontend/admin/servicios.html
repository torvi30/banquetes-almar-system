<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Servicios Admin | Banquetes Almar</title>
  <link rel="icon" type="image/png" href="../images/logo-almar.png" />
  <link rel="apple-touch-icon" href="../images/logo-almar.png" />
  <meta name="theme-color" content="#0b0b0b" />
  <link rel="stylesheet" href="../css/tailwind.css" />
</head>
<body>
  <header id="adminNavbar"></header>

  <section class="section admin-panel">
    <div class="container">
      <div class="section-heading">
        <p class="section-label">Panel Admin</p>
        <h2>Administrar Servicios</h2>
        <p>Gestiona, edita y publica los servicios exclusivos de Banquetes Almar.</p>
      </div>

      <!-- PESTAÑAS CATÁLOGO WEB: GALERÍA VS PAQUETES VS SERVICIOS VS ANUNCIO -->
      <div class="catalog-tabs-bar">
        <a href="./galeria.html?v=20260908.2" class="catalog-tab-btn">📸 Galería de Gala</a>
        <a href="./paquetes.html?v=20260908.2" class="catalog-tab-btn">💎 Paquetes Todo Incluido</a>
        <a href="./servicios.html?v=20260908.2" class="catalog-tab-btn active">🛎️ Servicios & Banquetería</a>
        <a href="./anuncio.html" class="catalog-tab-btn">📢 Franja de Anuncio Web</a>
      </div>

      <div class="dashboard-panel mb-8">
        <div class="dashboard-panel-head">
          <div>
            <p class="dashboard-mini-label">Gestión de Catálogo</p>
            <h3 id="formTitle">Agregar nuevo servicio</h3>
          </div>
        </div>

        <form id="serviceForm" class="quote-form" enctype="multipart/form-data">
          <input type="hidden" id="serviceId" />
          <input type="hidden" id="serviceCurrentImage" />

          <div class="form-group">
            <label for="titulo">Título del servicio *</label>
            <input type="text" id="titulo" placeholder="Ej: Banquetería y Catering de Gala" required />
          </div>

          <div class="form-group">
            <label for="categoria">Categoría</label>
            <select id="categoria">
              <option value="Catering">🍽️ Catering y Banquetería</option>
              <option value="Decoración">💐 Decoración y Flores</option>
              <option value="Mobiliario">🪑 Mobiliario y Menaje</option>
              <option value="Locación">🏛️ Locaciones (Salón / Fincas)</option>
              <option value="Producción">🎵 Sonido, Luces & DJ</option>
              <option value="Protocolo">🤵 Protocolo y Meseros</option>
              <option value="General">✨ Otro Servicio</option>
            </select>
          </div>

          <div class="form-group full-width">
            <label for="descripcion">Descripción del servicio *</label>
            <textarea id="descripcion" placeholder="Describe los beneficios, menú o alcance del servicio..." rows="3" required></textarea>
          </div>

          <div class="form-group">
            <label for="imagen">Subir imagen propia</label>
            <input type="file" id="imagen" accept="image/*" />
          </div>

          <div class="form-group">
            <label for="imagenUrl">O ingresar URL de imagen</label>
            <input type="url" id="imagenUrl" placeholder="https://ejemplo.com/foto.jpg" />
          </div>

          <div class="form-group full-width hidden" id="previewWrapper">
            <label>Vista previa de la imagen</label>
            <div class="w-full max-w-[380px] h-[210px] rounded-[14px] overflow-hidden border border-white/10 bg-[#0c0c0e]">
              <img id="imagePreview" src="" alt="Vista previa" class="w-full h-full object-cover" />
            </div>
          </div>

          <div class="form-group full-width event-form-actions">
            <button type="submit" class="btn btn-primary" id="saveServiceBtn">Guardar servicio</button>
            <button type="button" class="btn btn-secondary hidden" id="cancelEditBtn">Cancelar edición</button>
          </div>
        </form>
      </div>

      <!-- Filtros y búsqueda de servicios -->
      <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
        <div>
          <h3 class="text-white font-serif text-2xl mb-1">Servicios Publicados</h3>
          <p class="text-white/60 text-sm" id="servicesCount">Cargando...</p>
        </div>
        <div class="flex gap-3 flex-wrap">
          <input type="text" id="searchServiceInput" placeholder="🔍 Buscar servicio..." class="px-4 py-2 rounded-full bg-white/5 border border-white/10 text-white text-sm outline-none focus:border-amber-400" />
          <select id="filterCategorySelect" class="px-4 py-2 rounded-full bg-stone-900 border border-white/10 text-white text-sm outline-none focus:border-amber-400">
            <option value="Todos">Todas las categorías</option>
            <option value="Catering">🍽️ Catering</option>
            <option value="Decoración">💐 Decoración</option>
            <option value="Mobiliario">🪑 Mobiliario</option>
            <option value="Locación">🏛️ Locación</option>
            <option value="Producción">🎵 Producción</option>
          </select>
        </div>
      </div>
            <option value="Todos">Todas las categorías</option>
            <option value="Catering">🍽️ Catering</option>
            <option value="Decoración">💐 Decoración</option>
            <option value="Mobiliario">🪑 Mobiliario</option>
            <option value="Locación">🏛️ Locación</option>
            <option value="Producción">🎵 Producción</option>
          </select>
        </div>
      </div>

      <div id="servicesGrid" class="quotes-grid">
        <!-- Renderizado dinámico -->
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../js/components/admin-navbar.js"></script>
  <script type="module" src="../js/servicios-admin.js?v=20260907.25"></script>
</body>
</html>
