<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cliente | Banquetes Almar</title>
  <link rel="stylesheet" href="../css/tailwind.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/alerts-luxury.js?v=20260909.5"></script>
</head>
<body>
  <header id="adminNavbar"></header>

  <section class="section admin-panel">
    <div class="container">
      <div class="section-heading">
        <p class="section-label">Ficha de cliente</p>
        <h2>Detalle del cliente</h2>
        <p>Historial de eventos, pagos y resumen general.</p>
      </div>

      <div class="quote-card-actions" style="margin: 1.5rem 0 2rem 0;">
        <a href="./clientes.html" class="btn btn-secondary">← Volver a clientes</a>
        <a href="./reservas.html" class="btn btn-primary">Ir a eventos & agenda</a>
      </div>

      <div id="clienteInfo" class="calendar-panel" style="margin-bottom: 1.5rem;">
        <p>Cargando cliente...</p>
      </div>

      <div id="resumenCards" class="admin-summary" style="margin-bottom: 2rem;"></div>

      <div class="section-heading" style="margin-top: 2rem;">
        <h2>Eventos del cliente</h2>
        <p>Todos los eventos asociados a este cliente.</p>
      </div>
      <div id="eventosCliente" class="quotes-grid"></div>

      <div class="section-heading" style="margin-top: 2rem;">
        <h2>Pagos del cliente</h2>
        <p>Todos los pagos realizados por este cliente.</p>
      </div>
      <div id="pagosCliente" class="quotes-grid"></div>
    </div>
  </section>

  <script type="module" src="../js/components/admin-navbar.js"></script>
  <script type="module" src="../js/cliente-admin.js"></script>
</body>
</html>
