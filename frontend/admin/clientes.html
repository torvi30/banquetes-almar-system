<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Directorio de Clientes | Banquetes Almar</title>
  <link rel="icon" type="image/png" href="../images/logo-almar.png" />
  <link rel="apple-touch-icon" href="../images/logo-almar.png" />
  <meta name="theme-color" content="#0b0b0b" />
  <link rel="stylesheet" href="../css/tailwind.css" />
</head>
<body>
  <header id="adminNavbar"></header>

  <section class="section admin-panel">
    <div class="container">
      <div class="section-heading">
        <p class="section-label">Gestión de Clientes & CRM</p>
        <h2>Directorio Ejecutivo de Clientes</h2>
        <p>Base de datos unificada de clientes particulares, parejas nupciales, quinceañeras y cuentas corporativas.</p>
      </div>

      <!-- BANNER DE MÉTRICAS KPI -->
      <div class="pipeline-metrics-banner">
        <div class="pipeline-metric-card">
          <span class="pipeline-metric-label">👥 Total Clientes</span>
          <strong id="metricTotalClientes" class="pipeline-metric-val">0</strong>
        </div>

        <div class="pipeline-metric-card">
          <span class="pipeline-metric-label">👑 Clientes VIP & Corp.</span>
          <strong id="metricClientesVip" class="pipeline-metric-val" style="color: #e6c77b;">0</strong>
        </div>

        <div class="pipeline-metric-card">
          <span class="pipeline-metric-label">💰 Facturación Total (LTV)</span>
          <strong id="metricTotalLtv" class="pipeline-metric-val highlight-gold">$0</strong>
        </div>

        <div class="pipeline-metric-card">
          <span class="pipeline-metric-label">📅 Con Eventos Activos</span>
          <strong id="metricConEventos" class="pipeline-metric-val" style="color: #10b981;">0</strong>
        </div>
      </div>

      <!-- BARRA DE HERRAMIENTAS EJECUTIVA: BÚSQUEDA, FILTROS Y NUEVO CLIENTE -->
      <div class="cotizaciones-toolbar" style="margin-bottom: 2rem;">
        <div class="form-group" style="flex: 2;">
          <label for="searchClienteInput">Buscar en el directorio</label>
          <input type="text" id="searchClienteInput" placeholder="Buscar por nombre, teléfono, cédula/NIT, correo o ciudad..." />
        </div>

        <div class="form-group">
          <label for="filterTipoCliente">Categoría / Perfil</label>
          <select id="filterTipoCliente">
            <option value="">Todos los perfiles</option>
            <option value="VIP">👑 Clientes VIP</option>
            <option value="Empresarial">🏢 Corporativos / Empresas</option>
            <option value="Cliente">👤 Clientes Estándar</option>
          </select>
        </div>

        <div class="form-group">
          <label for="sortClientes">Ordenar por</label>
          <select id="sortClientes">
            <option value="recientes" selected>⚡ Más recientes primero</option>
            <option value="az">🔤 Alfabético (A - Z)</option>
            <option value="za">🔤 Alfabético (Z - A)</option>
          </select>
        </div>

        <div style="display: flex; gap: 8px; align-self: flex-end;">
          <button id="btnOpenNewClientModal" class="btn btn-primary" style="padding: 10px 18px; font-size: 0.88rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px;">
            ✨ + Nuevo Cliente
          </button>
        </div>
      </div>

      <!-- CUADRÍCULA DE CLIENTES -->
      <div id="clientsGrid" class="quotes-grid">
        <!-- Renderizado dinámico desde clientes-admin.js -->
      </div>
    </div>
  </section>

  <!-- MODAL DE CREACIÓN / EDICIÓN DE CLIENTE -->
  <div class="client-modal-overlay" id="clientModalOverlay">
    <div class="client-modal-card">
      <div class="client-modal-header">
        <h3 class="client-modal-title" id="clientModalTitle">Registrar Nuevo Cliente</h3>
        <button type="button" class="client-modal-close" id="btnCloseClientModal">&times;</button>
      </div>

      <form id="clientForm">
        <input type="hidden" id="clientId" />

        <div class="form-group">
          <label for="nombre">Nombre Completo o Razón Social *</label>
          <input type="text" id="nombre" placeholder="Ej: Valentina Muñoz & Juan Esteban" required />
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="telefono">Teléfono Móvil (WhatsApp) *</label>
            <input type="tel" id="telefono" placeholder="Ej: 311 789 2233" required />
          </div>

          <div class="form-group">
            <label for="documento">Cédula de Ciudadanía o NIT</label>
            <input type="text" id="documento" placeholder="Ej: 1.036.945.112" />
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" placeholder="cliente@banquetesalmar.com" />
          </div>

          <div class="form-group">
            <label for="tipo_cliente">Perfil / Categoría</label>
            <select id="tipo_cliente">
              <option value="Cliente" selected>👤 Cliente Estándar</option>
              <option value="VIP">👑 Cliente VIP</option>
              <option value="Empresarial">🏢 Cuenta Corporativa / Empresarial</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="direccion">Dirección y Municipio</label>
          <input type="text" id="direccion" placeholder="Ej: Calle 30 # 29-15, Marinilla (Antioquia)" />
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid rgba(255, 255, 255, 0.08);">
          <button type="button" class="btn btn-secondary" id="btnCancelModal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="saveClientBtn">Guardar Cliente</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../js/components/admin-navbar.js"></script>
  <script type="module" src="../js/clientes-admin.js?v=20260917.1"></script>
</body>
</html>
